apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: pod-failure-experiment
  namespace: default
spec:
  schedule: "@yearly"
  type: PodChaos
  historyLimit: 5
  concurrencyPolicy: Forbid
  podChaos:
    action: pod-failure
    mode: fixed-percent
    value: "40"
    selector:
      labelSelectors:
        project: chaosmesh-microservice
    duration: "60s"
