apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: cpu-stress-experiment
  namespace: default
spec:
  schedule: "@yearly"
  type: StressChaos
  historyLimit: 5
  concurrencyPolicy: Forbid
  stressChaos:
    mode: one
    selector:
      labelSelectors:
        project: chaosmesh-microservice
    stressors:
      cpu:
        workers: 2
        load: 80
    duration: "60s"
