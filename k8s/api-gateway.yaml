apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        project: chaosmesh-microservice
        tier: frontend
    spec:
      containers:
      - name: api-gateway
        image: api-gateway
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: ORDER_SERVICE_URL
          value: "http://order-service"
        - name: USER_SERVICE_URL
          value: "http://user-service"
        - name: INVENTORY_SERVICE_URL
          value: "http://inventory-service"
        livenessProbe:
          httpGet:
            path: /api/message
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/message
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 30000
  type: NodePort
